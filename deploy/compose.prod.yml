# 正式環境：Oracle Cloud VM 上用 docker compose 跑整套。
#
#   cloudflared（裝在 VM 本機，systemd 服務）─HTTP→ 127.0.0.1:8080 ─→ web（Caddy）
#                                                                   ├─ 靜態檔
#                                                                   └─ /api/*、/actuator/health → backend ─→ postgres
#                                                                                                     └──→ Cloudflare R2（照片）
#
# 這個檔案沒有對外開任何 port：web 只綁 127.0.0.1，外面的流量只能從 Cloudflare Tunnel 進來，
# 也就一定先經過 Cloudflare Access 的 email 驗證。backend 與 postgres 完全不綁 port。
#
# 在 VM 上：
#   cd ~/kokoroe
#   docker compose -f compose.prod.yml pull
#   docker compose -f compose.prod.yml up -d
# 機密放在同目錄的 .env（不進 git，範本見 .env.example）。
# ${VAR:?} 的意思是「沒設就拒絕啟動」，避免漏設密碼時默默用空字串跑起來。

name: kokoroe

x-hardening: &hardening
  restart: unless-stopped
  # 容器裡的程序不能透過 setuid 之類的手段提權
  security_opt:
    - no-new-privileges:true
  # 程序數上限，防止 fork bomb 或執行緒失控拖垮整台 VM
  pids_limit: 512
  logging:
    driver: json-file
    # 預設的 log 沒有上限，跑久了會把硬碟塞滿
    options:
      max-size: 10m
      max-file: "5"

services:
  postgres:
    <<: *hardening
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?}
      POSTGRES_USER: ${DB_USER:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    <<: *hardening
    image: ghcr.io/leolin-hub/kokoroe-backend:${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:?}
      DB_USER: ${DB_USER:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?}
    # 根目錄唯讀：被打穿也沒辦法改 jar 或留下檔案。
    # /tmp 要可寫：Tomcat 暫存 multipart 上傳、ImageIO 處理圖片都會用到。
    # 大小要放得下一張 41 MB 上傳加上處理時的暫存檔。
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    # 記憶體上限要裝得下：JVM heap（上限的 60%，見 backend/Dockerfile）、
    # /tmp 的 tmpfs（寫進去的檔案也算在這個容器的記憶體裡，最多 256 MB），
    # 以及 metaspace、執行緒堆疊、網路緩衝區。超過時 kernel 會直接砍掉容器。
    # 一張 40 MP 照片處理時 heap 峰值約 200 MB，1.2 GB 的 heap 綽綽有餘。
    mem_limit: 2g
    networks: [db, web]
    healthcheck:
      # eclipse-temurin 的 image 內建 curl；-f 讓非 2xx（health 是 DOWN 時回 503）算失敗
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Flyway migration 與 JVM 暖機都在這段時間內
      start_period: 90s

  web:
    <<: *hardening
    image: ghcr.io/leolin-hub/kokoroe-web:${IMAGE_TAG:-latest}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 只綁 127.0.0.1：給同一台機器上的 cloudflared 連。
      # 綁 0.0.0.0 的話，Docker 開的 port 會繞過 VM 防火牆，等於讓人直接打 IP 跳過 Access。
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    # 不用 root 跑。Caddyfile 聽 8080，不需要綁 1024 以下 port 的特權
    user: "65532:65532"
    read_only: true
    # Caddy 啟動時會寫自己的狀態檔；這兩個目錄給記憶體檔案系統就好，不需要保留
    tmpfs:
      - /data:uid=65532,gid=65532
      - /config:uid=65532,gid=65532
    cap_drop: [ALL]
    mem_limit: 128m
    networks: [web]
    # 沒有 healthcheck 的話，deploy.yml 的 up --wait 只看容器「有在跑」，
    # Caddy 一啟動就崩潰重啟的狀況也會被當成成功。alpine 內建 busybox wget
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # internal：這個網路沒有對外的路由，postgres 連不到網際網路，網際網路也連不到它
  db:
    internal: true
  # backend 要連 Cloudflare R2，所以需要一個能出去的網路
  web: {}

volumes:
  pgdata:
    name: kokoroe-pgdata-prod
