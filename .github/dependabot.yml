version: 2

# 這個專案跑在相當新的版本上(Spring Boot 4、Vite 8、React 19),
# 修補更新的節奏會比成熟版本快,值得讓 Dependabot 幫忙盯。
#
# 全部設為 weekly 而非 daily:每天一批 PR 的下場就是學會無視它們。
# 用 groups 把 minor/patch 收成一支 PR,進一步壓低噪音 ——
# 真正需要逐支審的是 major,那才是會壞相容性的。
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      backend-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      frontend-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  # Dockerfile 的 base image（eclipse-temurin、node、caddy）。
  # 用的都是 21-jre、2-alpine 這種浮動 tag，每次建置本來就會拉到最新的修補版；
  # 這裡主要是在出新的 major（例如 Node 26 LTS）時發 PR 提醒，所以忽略 minor/patch。
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-minor, version-update:semver-patch]

  # workflow 裡釘的 actions/checkout 之類的版本也會過期。
  # 這個 ecosystem 的 directory 必須是 /,它只看 .github/workflows。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ['*']
